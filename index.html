<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>乙4 危険物クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>*{box-sizing:border-box}body{margin:0}
/* Layout: one-column game card styled after the black-and-yellow 危険物 placard; fuel gauge = timer */
:root{
  --bg:#141210; --panel:#1f1c18; --line:#3a352d;
  --sign:#f5c400; --ink:#f3efe6; --muted:#a49c8c;
  --ok:#3fbf6a; --ng:#e5484d;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:20px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sign{display:flex;align-items:center;gap:14px;background:#000;border:3px solid var(--sign);padding:10px 14px}
.sign b{font-family:var(--display);font-weight:400;color:var(--sign);font-size:44px;line-height:1}
.sign h1{margin:0;font-family:var(--display);font-weight:400;font-size:22px;color:var(--sign);text-wrap:balance;line-height:1.3}
.sign small{display:block;font-family:var(--body);color:var(--muted);font-size:12px;letter-spacing:.08em}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.hud strong{color:var(--ink);font-size:18px}
.lives span{font-size:20px;color:var(--ng)}
.lives span.off{color:var(--line)}
.gauge{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.gauge .bar{flex:1;height:12px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.gauge .fill{height:100%;width:100%;background:var(--sign);transition:width .1s linear}
.gauge .fill.low{background:var(--ng)}
.card{background:var(--panel);border:1px solid var(--line);padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.qno{font-size:12px;letter-spacing:.12em;color:var(--sign)}
.q{margin:0;font-size:19px;font-weight:700;line-height:1.55;text-wrap:pretty}
.choices{display:grid;gap:10px}
.choices button{font:inherit;text-align:left;color:var(--ink);background:var(--bg);border:2px solid var(--line);padding:12px 14px;cursor:pointer;min-height:48px}
.choices button:hover:not(:disabled){border-color:var(--sign)}
.choices button:focus-visible,.btn:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.choices button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg))}
.choices button.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 18%,var(--bg))}
.choices button:disabled{cursor:default}
.exp{border-left:4px solid var(--sign);padding:4px 0 4px 12px;color:var(--ink);font-size:15px}
.exp .tag{font-family:var(--display);font-size:18px;display:block}
.exp .tag.ok{color:var(--ok)} .exp .tag.ng{color:var(--ng)}
.btn{font-family:var(--display);font-size:18px;background:var(--sign);color:#000;border:0;padding:14px 18px;cursor:pointer;width:100%}
.btn:hover{filter:brightness(1.08)}
.big{font-family:var(--display);font-size:56px;color:var(--sign);line-height:1;font-variant-numeric:tabular-nums}
.center{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.rules{margin:0;padding-left:1.2em;color:var(--muted);font-size:15px}
.miss{font-size:14px;color:var(--muted);text-align:left;width:100%}
.miss li{margin-bottom:6px}
.combo{color:var(--sign);font-weight:700}
@media (prefers-reduced-motion:reduce){.gauge .fill{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="sign"><b>危</b><div><h1>乙4 危険物クイズ</h1><small>第4類 危険物取扱者 練習ゲーム</small></div></div>
  <div id="app"></div>
</div>
<script>
// ▼ スプレッドシートの「ウェブに公開」でコピーしたCSVのURLを "" の中に貼る
const SHEET_URL = "";

let BANK=[];
function parseCSV(t){
  const rows=[];let row=[],cell='',q=false;
  t=t.replace(/^\uFEFF/,'');
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c=='"') q=true;
    else if(c==','){row.push(cell);cell='';}
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&t[i+1]=='\n')i++; row.push(cell);rows.push(row);row=[];cell=''; }
    else cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows;
}
function toBank(rows){
  return rows.slice(1).map(r=>r.map(x=>(x||'').trim()))
    .filter(r=>r[0]&&r[1]&&r[2])
    .map(r=>[r[0],[r[1],...r.slice(2,5).filter(Boolean)],r[5]||'']);
}
async function load(){
  app.innerHTML='<div class="card center"><div class="qno">問題を読み込み中…</div></div>';
  try{
    if(!SHEET_URL) throw new Error('SHEET_URL が空です。index.html にスプレッドシートのURLを貼ってください。');
    const res=await fetch(SHEET_URL,{cache:'no-store'});
    if(!res.ok) throw new Error('スプレッドシートが開けませんでした('+res.status+')。「ウェブに公開」されているか確認してください。');
    BANK=toBank(parseCSV(await res.text()));
    if(!BANK.length) throw new Error('問題が0件でした。1行目が見出し、2行目から問題になっているか確認してください。');
    title();
  }catch(err){
    app.innerHTML=`<div class="card center"><div class="qno">読み込みエラー</div><p>${esc(err.message)}</p><button class="btn" id="retry">もう一度読み込む</button></div>`;
    document.getElementById('retry').onclick=load;
  }
}
const ROUND_MAX=10, TIME=20, LIVES=3;
let st=null, timer=null;
let ROUND=ROUND_MAX;
const app=document.getElementById('app');
const best=()=>{try{return +localStorage.getItem('otsu4best')||0}catch(e){return 0}};
const saveBest=v=>{try{localStorage.setItem('otsu4best',v)}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function title(){
  clearInterval(timer);
  ROUND=Math.min(ROUND_MAX,BANK.length);
  app.innerHTML=`<div class="card center">
    <div class="qno">登録問題数 ${BANK.length}問</div><div class="qno">ハイスコア</div><div class="big">${best()}</div>
    <ul class="rules">
      <li>全${ROUND}問、1問${TIME}秒。燃料ゲージが切れたら不正解</li>
      <li>ライフは${LIVES}つ。全部なくなると終了</li>
      <li>早く答えるほど高得点、連続正解でボーナス</li>
    </ul>
    <button class="btn" id="start">スタート</button></div>`;
  document.getElementById('start').onclick=start;
}
function start(){
  ROUND=Math.min(ROUND_MAX,BANK.length);
  st={qs:shuffle(BANK).slice(0,ROUND),i:0,score:0,lives:LIVES,combo:0,miss:[]};
  ask();
}
function hud(){
  return `<div class="hud"><span>スコア <strong>${st.score}</strong></span>
   <span class="lives">${Array.from({length:LIVES},(_,k)=>`<span class="${k<st.lives?'':'off'}">●</span>`).join('')}</span>
   <span>${st.i+1} / ${ROUND}</span></div>`;
}
function ask(){
  const [q,ch,ex]=st.qs[st.i];
  const opts=shuffle(ch.map((t,k)=>({t,ok:k===0})));
  app.innerHTML=hud()+`<div class="gauge">燃料<div class="bar"><div class="fill" id="fill"></div></div><span id="sec">${TIME}</span>秒</div>
  <div class="card"><div class="qno">第${st.i+1}問</div>
   <p class="q">${esc(q)}</p>
   <div class="choices">${opts.map((o,k)=>`<button data-k="${k}">${esc(o.t)}</button>`).join('')}</div>
   <div id="after"></div></div>`;
  const btns=[...app.querySelectorAll('.choices button')];
  const t0=Date.now();
  const fill=document.getElementById('fill'), sec=document.getElementById('sec');
  clearInterval(timer);
  timer=setInterval(()=>{
    const left=Math.max(0,TIME-(Date.now()-t0)/1000);
    fill.style.width=(left/TIME*100)+'%';
    fill.classList.toggle('low',left<5);
    sec.textContent=Math.ceil(left);
    if(left<=0) answer(-1);
  },100);
  btns.forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  function answer(k){
    clearInterval(timer);
    btns.forEach((b,j)=>{b.disabled=true;if(opts[j].ok)b.classList.add('ok');});
    const right=k>=0&&opts[k].ok;
    let msg;
    if(right){
      st.combo++;
      const left=Math.max(0,TIME-(Date.now()-t0)/1000);
      const pts=100+Math.round(left*5)+(st.combo>1?(st.combo-1)*20:0);
      st.score+=pts;
      msg=`<span class="tag ok">正解！ +${pts}</span>${st.combo>1?`<span class="combo">${st.combo}連続正解</span><br>`:''}`;
    }else{
      if(k>=0)btns[k].classList.add('ng');
      st.combo=0;st.lives--;st.miss.push(q+' → '+ch[0]);
      msg=`<span class="tag ng">${k<0?'時間切れ':'不正解'}</span>`;
    }
    const over=st.lives<=0||st.i===ROUND-1;
    document.getElementById('after').innerHTML=`<div class="exp">${msg}${esc(ex)}</div>
      <button class="btn" id="next" style="margin-top:12px">${over?'結果を見る':'次の問題'}</button>`;
    app.querySelector('.hud').outerHTML=hud();
    const nx=document.getElementById('next');nx.focus();
    nx.onclick=()=>{if(over)result();else{st.i++;ask();}};
  }
}
function result(){
  const b=best(), nw=st.score>b; if(nw)saveBest(st.score);
  const cleared=st.lives>0;
  app.innerHTML=`<div class="card center">
    <div class="qno">${cleared?'全問終了':'ライフがなくなりました'}</div>
    <div class="big">${st.score}</div>
    <div>${nw?'<span class="combo">ハイスコア更新！</span>':'ハイスコア '+b}</div>
    ${st.miss.length?`<div class="miss"><div class="qno">間違えた問題</div><ul>${st.miss.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>`:'<div class="combo">ノーミス！</div>'}
    <button class="btn" id="again">もう一度</button>
    <button class="btn" id="top" style="background:var(--line);color:var(--ink)">タイトルへ</button></div>`;
  document.getElementById('again').onclick=start;
  document.getElementById('top').onclick=title;
}
load();
</script>
</body>
</html>
